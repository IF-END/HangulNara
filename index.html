<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한글 놀이터">
<title>한글 놀이터</title>
<style>
:root{
  --bg:#FFF6E5; --ink:#5B4636; --soft:#A08C7A; --card:#FFFFFF;
  --pink:#FFC8DD; --peach:#FFD6A5; --yellow:#FDF0A6; --mint:#CDEAC0; --sky:#BDE0FE; --lav:#DCCBF7;
  --coral:#FF8FA3; --coral-d:#E66A82; --green:#7BD389; --green-d:#4FAE62; --line:#F1E4D0;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{background:var(--bg);color:var(--ink);touch-action:manipulation;
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(circle at 12% 8%,#FFE9C9 0,transparent 38%),radial-gradient(circle at 92% 96%,#FFDDE8 0,transparent 36%),var(--bg)}

/* ---------- 공통 버튼 ---------- */
.rbtn{min-width:64px;height:64px;border-radius:22px;background:#fff;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 5px 0 #E9D9C2;transition:transform .08s, box-shadow .08s;flex:none}
.rbtn:active,.card:active,.choice:active,.sw:active{transform:translateY(4px);box-shadow:0 1px 0 #E9D9C2}
.rbtn.gone{display:none}
.rbtn .arrow{font-size:46px;font-weight:900;margin-top:-6px;color:var(--coral-d)}
.rbtn.star{padding:0 16px;background:#FFF1B8;box-shadow:0 5px 0 #EBCF6A;font-size:28px}
.rbtn.star span{font-size:26px}

/* ---------- 상단바 ---------- */
#top{display:none;align-items:center;gap:10px;padding:10px 14px 6px;height:82px;flex:none}
#top.on{display:flex}
#topMid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:26px;overflow:hidden;white-space:nowrap}
#topMid .emo{font-size:46px;line-height:1}
#topMid .chip{min-width:60px;height:60px;padding:0 8px;border-radius:18px;background:#fff;font-size:36px;box-shadow:0 4px 0 #E9D9C2;display:flex;align-items:center;justify-content:center}
#topMid .ttl{font-size:26px;color:var(--ink)}

/* ---------- 화면 ---------- */
.screen{flex:1;min-height:0;display:none;position:relative}
.screen.active{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* 시작 화면 */
#splash{flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
#splash .mascot{font-size:min(26vh,30vw);line-height:1;animation:bob 1.6s ease-in-out infinite alternate}
#splash h1{margin:0;font-size:min(9vh,10vw);letter-spacing:.04em;color:var(--coral-d);text-shadow:0 4px 0 #fff}
#splash h1 b{color:#4D96FF} #splash h1 i{font-style:normal;color:#F2A100}
#startBtn{width:min(34vh,40vw);height:min(18vh,22vw);border-radius:999px;background:var(--green);box-shadow:0 10px 0 var(--green-d);font-size:min(10vh,12vw);color:#fff;animation:pulse 1.2s ease-in-out infinite}
#startBtn:active{transform:translateY(8px);box-shadow:0 2px 0 var(--green-d);animation:none}
@keyframes bob{from{transform:translateY(-8px) rotate(-3deg)}to{transform:translateY(8px) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* 홈 */
#home{flex-direction:column;padding:6px 18px 18px;gap:14px}
.stage-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.card{position:relative;border-radius:34px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;transition:transform .08s, box-shadow .08s}
.stage{font-size:min(3.4vh,3.6vw)}
.stage .ico{font-size:min(13vh,13vw);line-height:1.1}
.stage .ico.txt{letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.stage .num{position:absolute;left:16px;top:14px;width:60px;height:60px;border-radius:50%;background:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.stage.s1{background:var(--sky)} .stage.s2{background:var(--peach)} .stage.s3{background:var(--mint)} .stage.s4{background:var(--pink)}

/* 격자 (글자/동물 고르기) */
.col{flex-direction:column;padding:4px 16px 14px;gap:10px}
.tabs{display:flex;gap:10px;justify-content:center;flex:none}
.tab{height:64px;min-width:130px;padding:0 20px;border-radius:999px;background:#fff;font-size:30px;box-shadow:0 5px 0 #E9D9C2}
.tab.on{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-d)}
.grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;gap:14px;padding:6px 4px 18px;
  grid-template-columns:repeat(auto-fill,minmax(126px,1fr));align-content:start}
.grid .card{aspect-ratio:1/1;font-size:72px;line-height:1}
.grid .card .sub{font-size:24px;line-height:1.2}
.grid .card .mini{position:absolute;right:10px;bottom:8px;font-size:30px}
.grid .card .badge{position:absolute;left:8px;top:6px;font-size:30px}
.grid.animals{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.animals .card{font-size:76px}
.grid.animals .card .sub{font-size:28px}

/* 1단계 글자 상세 */
#modal{position:fixed;inset:0;background:rgba(91,70,54,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.show{display:flex}
.mcardbox{position:relative;width:min(92vw,760px);max-height:94vh;background:#fff;border-radius:44px;padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 12px 0 rgba(0,0,0,.15);animation:popin .3s cubic-bezier(.2,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#mLetter{font-size:min(36vh,44vw);line-height:1.05;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
#mWord{display:flex;align-items:center;gap:14px;font-size:min(7vh,8vw);height:min(11vh,12vw);padding:0 26px;border-radius:999px;background:var(--yellow)}
#mWord .emo{font-size:1.3em}
#mWord em{font-style:normal;color:var(--coral-d)}
.mrow{display:flex;gap:14px;align-items:center;margin-top:6px}
.mrow .rbtn{width:84px;height:76px;background:var(--bg)}
.mrow .rbtn.big{width:110px;background:var(--sky);box-shadow:0 5px 0 #8FC2EC;font-size:40px}
.mrow .rbtn.pen{background:var(--peach);box-shadow:0 5px 0 #E8B36F;font-size:40px}
#mClose{position:absolute;right:14px;top:14px;background:var(--pink);box-shadow:0 5px 0 #EFA2BE;font-size:30px;color:#fff}

/* 2·3단계 쓰기 */
#write{flex-direction:column;padding:4px 12px 12px;gap:10px}
.w-stage{flex:1;min-height:0;display:flex;align-items:stretch;gap:8px}
.w-stage .rbtn{align-self:center;height:110px;min-width:60px;width:60px}
.paper{flex:1;min-width:0;position:relative;background:#fff;border-radius:30px;box-shadow:inset 0 0 0 4px var(--line),0 6px 0 rgba(0,0,0,.06);overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{flex:none;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
.tools .grp{display:flex;gap:6px;align-items:center}
.sw{width:60px;height:60px;border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.15),inset 0 0 0 4px #fff;transition:transform .08s}
.sw.on{transform:scale(1.14);box-shadow:0 4px 0 rgba(0,0,0,.15),inset 0 0 0 4px #fff,0 0 0 5px var(--ink)}
.sw.rb{background:conic-gradient(#ff5a5f,#ff9f1c,#ffd60a,#3dbe6c,#3a86ff,#9b5de5,#ff5a5f)}
.tools .rbtn.on{background:var(--yellow);box-shadow:0 5px 0 #E3CF5A, 0 0 0 4px var(--ink)}
#doneBtn{height:68px;padding:0 22px;border-radius:999px;background:var(--green);box-shadow:0 6px 0 var(--green-d);color:#fff;font-size:26px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#doneBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--green-d)}
#doneBtn .e{font-size:34px}

/* 게임 메뉴 */
#games{padding:8px 18px 18px;gap:16px;align-items:stretch}
#games .card{flex:1;font-size:min(3.6vh,3.6vw)}
#games .card .ico{font-size:min(16vh,15vw);line-height:1.1}
#games .g1{background:var(--yellow)} #games .g2{background:var(--sky)} #games .g3{background:var(--lav)}
@media (orientation:portrait){#games{flex-direction:column}}

.dots{flex:none;display:flex;gap:10px;justify-content:center;font-size:34px;height:44px;align-items:center}
.dots span{filter:grayscale(1);opacity:.35;transition:.3s}
.dots span.on{filter:none;opacity:1;transform:scale(1.2)}

/* 게임 A */
#gameA{flex-direction:column;padding:4px 16px 16px;gap:10px;align-items:center;touch-action:none}
.qa{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vw;flex-wrap:wrap}
.qa .pic{font-size:min(24vh,24vw);line-height:1;width:min(30vh,30vw);height:min(30vh,30vw);border-radius:40px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.boxes{display:flex;gap:12px}
.boxes div{width:min(19vh,19vw);height:min(19vh,19vw);border-radius:26px;background:#fff;font-size:min(13vh,13vw);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.boxes div.blank{background:#FFF0F3;box-shadow:inset 0 0 0 5px var(--coral);color:var(--coral);animation:pulse 1s infinite}
.boxes div.fill{background:var(--mint);animation:popin .35s cubic-bezier(.2,1.6,.5,1);color:var(--green-d)}
.choices{flex:none;display:flex;gap:18px;justify-content:center}
.choice{width:min(22vh,24vw);height:min(18vh,20vw);min-height:96px;border-radius:30px;font-size:min(12vh,13vw);box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .08s}
.choice:nth-child(1){background:var(--sky)} .choice:nth-child(2){background:var(--peach)} .choice:nth-child(3){background:var(--lav)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px) rotate(-4deg)}40%{transform:translateX(12px) rotate(4deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.glow{box-shadow:0 0 0 8px #FFD60A,0 8px 0 rgba(0,0,0,.12)!important}

/* 게임 B 풍선 */
#gameB{flex-direction:column;padding:4px 10px 10px;gap:6px;touch-action:none}
.sky{flex:1;min-height:0;position:relative;border-radius:34px;overflow:hidden;background:linear-gradient(#CFEBFF,#BFE6F7 55%,#9FD8EE);touch-action:none}
.sky .cloud{position:absolute;font-size:80px;opacity:.75;animation:drift 14s linear infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.bwrap{position:absolute;transform:translate(-50%,0);animation:rise .9s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{transform:translate(-50%,110vh)}to{transform:translate(-50%,0)}}
.bwrap.away{transition:transform 1.1s ease-in, opacity 1.1s;transform:translate(-50%,-120vh);opacity:.2}
.balloon{position:relative;width:min(23vh,21vw);height:min(28vh,25.5vw);min-width:110px;min-height:134px;border-radius:50% 50% 50% 50%/46% 46% 54% 54%;
  display:flex;align-items:center;justify-content:center;font-size:min(13vh,12vw);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);
  box-shadow:inset -12px -16px 0 rgba(0,0,0,.08),inset 14px 14px 0 rgba(255,255,255,.3);animation:float 2.2s ease-in-out infinite alternate;touch-action:none}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:min(12vh,10vw);background:rgba(91,70,54,.35);transform:translateX(-50%)}
.balloon::before{content:"";position:absolute;left:50%;top:calc(100% - 4px);border:9px solid transparent;border-bottom-color:inherit;transform:translate(-50%,-6px);border-bottom-color:currentColor;opacity:.0}
@keyframes float{from{transform:translateY(-12px) rotate(-3deg)}to{transform:translateY(12px) rotate(3deg)}}
.balloon.pop{animation:bpop .28s ease-out forwards}
@keyframes bpop{to{transform:scale(1.7);opacity:0}}
.balloon.shake{animation:shake .4s}

/* 게임 C 짝맞추기 */
#gameC{flex-direction:column;padding:4px 16px 16px;gap:10px;touch-action:none}
.mem{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:14px;perspective:1200px}
@media (orientation:portrait){.mem{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}}
.mc{position:relative;border-radius:26px;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s;min-height:70px}
.mc.open,.mc.match{transform:rotateY(180deg)}
.mc .f{position:absolute;inset:0;border-radius:26px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.mc .back{background:repeating-linear-gradient(45deg,var(--lav),var(--lav) 14px,#E9DEFB 14px,#E9DEFB 28px);font-size:min(9vh,9vw)}
.mc .face{background:#fff;transform:rotateY(180deg);font-size:min(13vh,12vw)}
.mc.match .face{background:var(--mint);animation:pulse .5s}

/* 스티커북 */
#book{flex-direction:column;padding:4px 18px 16px;gap:10px}
.album{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#fff;border-radius:34px;padding:22px;
  box-shadow:inset 0 0 0 5px var(--yellow),0 8px 0 rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px;align-content:start}
.slot{aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;border:4px dashed #EADBC6;color:#EADBC6}
.slot.got{border:0;background:radial-gradient(circle,#FFF7D6 55%,#FFE9A8 100%);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.slot.got.boing{animation:pulse .4s}
.slot.new{animation:popin .6s cubic-bezier(.2,1.8,.5,1)}
#resetBtn{position:absolute;right:26px;bottom:24px;width:60px;height:60px;border-radius:50%;font-size:26px;opacity:.35;background:#fff}

/* 스티커 팝업 / 폭죽 */
#pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:rgba(255,246,229,.88)}
#pop.show{display:flex}
#pop .rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,214,10,.28) 0 12deg,transparent 12deg 24deg);animation:spin 14s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
#pop .big{position:relative;font-size:min(34vh,40vw);line-height:1;width:min(50vh,56vw);height:min(50vh,56vw);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 14px #FFE38A,0 16px 0 rgba(0,0,0,.1);animation:stick .7s cubic-bezier(.2,1.7,.4,1)}
@keyframes stick{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
#pop .msg{position:relative;font-size:min(7vh,8vw);color:var(--coral-d);text-shadow:0 3px 0 #fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
</style>
</head>
<body>
<div id="app">

  <header id="top">
    <button class="rbtn" id="btnHome" aria-label="홈">🏠</button>
    <button class="rbtn" id="btnBack" aria-label="뒤로"><span class="arrow">‹</span></button>
    <div id="topMid"></div>
    <button class="rbtn" id="btnHint" aria-label="소리 듣기">🔊</button>
    <button class="rbtn star" id="btnBook" aria-label="스티커북">⭐<span id="starCnt">0</span></button>
  </header>

  <section id="splash" class="screen active">
    <div class="mascot">🐳</div>
    <h1>한<b>글</b> <i>놀</i>이터</h1>
    <button id="startBtn" aria-label="시작">▶</button>
  </section>

  <section id="home" class="screen">
    <div class="stage-grid">
      <button class="card stage s1" data-go="learn" data-say="자음 모음 익히기"><span class="num">1</span><span class="ico txt">ㄱㄴㄷ</span><span>👀 익히기</span></button>
      <button class="card stage s2" data-go="pick:jamo" data-say="손으로 따라 쓰기"><span class="num">2</span><span class="ico">✏️</span><span>따라 쓰기</span></button>
      <button class="card stage s3" data-go="pick:animal" data-say="바다 친구 이름 써 보기"><span class="num">3</span><span class="ico">🐳</span><span>바다 친구 이름</span></button>
      <button class="card stage s4" data-go="games" data-say="놀이 게임"><span class="num">4</span><span class="ico">🎈</span><span>놀이 게임</span></button>
    </div>
  </section>

  <section id="learn" class="screen col">
    <div class="tabs" id="learnTabs"></div>
    <div class="grid" id="learnGrid"></div>
  </section>

  <section id="pick" class="screen col">
    <div class="tabs" id="pickTabs"></div>
    <div class="grid" id="pickGrid"></div>
  </section>

  <section id="write" class="screen">
    <div class="w-stage">
      <button class="rbtn" id="wPrev" aria-label="이전"><span class="arrow">‹</span></button>
      <div class="paper" id="paper">
        <canvas id="guideCv"></canvas>
        <canvas id="drawCv"></canvas>
      </div>
      <button class="rbtn" id="wNext" aria-label="다음"><span class="arrow">›</span></button>
    </div>
    <div class="tools">
      <div class="grp" id="swatches"></div>
      <div class="grp">
        <button class="rbtn" id="tErase" aria-label="지우개">🧽</button>
        <button class="rbtn" id="tUndo" aria-label="되돌리기">↩️</button>
        <button class="rbtn" id="tClear" aria-label="다시 쓰기">🗑️</button>
        <button class="rbtn" id="tDemo" aria-label="쓰는 순서 보기">👆</button>
      </div>
      <button id="doneBtn"><span class="e">✅</span>다 썼어요!</button>
    </div>
  </section>

  <section id="games" class="screen">
    <button class="card g1" data-go="gameA" data-say="빈칸 채우기"><span class="ico">🧩</span><span>빈칸 채우기</span></button>
    <button class="card g2" data-go="gameB" data-say="풍선 팡팡"><span class="ico">🎈</span><span>풍선 팡팡</span></button>
    <button class="card g3" data-go="gameC" data-say="짝 맞추기"><span class="ico">🃏</span><span>짝 맞추기</span></button>
  </section>

  <section id="gameA" class="screen">
    <div class="dots" id="dotsA"></div>
    <div class="qa"><button class="pic" id="aPic"></button><div class="boxes" id="aBoxes"></div></div>
    <div class="choices" id="aChoices"></div>
  </section>

  <section id="gameB" class="screen">
    <div class="dots" id="dotsB"></div>
    <div class="sky" id="sky"></div>
  </section>

  <section id="gameC" class="screen">
    <div class="mem" id="mem"></div>
  </section>

  <section id="book" class="screen">
    <div class="album" id="album"></div>
    <button id="resetBtn" aria-label="부모님용 초기화 (길게 누르기)">⚙️</button>
  </section>
</div>

<div id="modal">
  <div class="mcardbox">
    <button class="rbtn" id="mClose" aria-label="닫기">✕</button>
    <div id="mLetter"></div>
    <button id="mWord"></button>
    <div class="mrow">
      <button class="rbtn" id="mPrev"><span class="arrow">‹</span></button>
      <button class="rbtn big" id="mSay">🔊</button>
      <button class="rbtn pen" id="mPen">✏️</button>
      <button class="rbtn" id="mNext"><span class="arrow">›</span></button>
    </div>
  </div>

const Sfx={
  ctx:null,
  unlock(){
    if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext; if(AC){try{this.ctx=new AC();}catch(e){}}}
    if(this.ctx&&this.ctx.state==='suspended'){this.ctx.resume();}
  },
  tone(f,at,dur,type,vol,slide){
    const c=this.ctx; if(!c) return;
    const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.03);
  },

const fx=$('#fx'), fctx=fx.getContext('2d'); let parts=[], fxRaf=0;
const CCOL=['#FF6B81','#FFB703','#7BD389','#4D96FF','#B79CFF','#FF8FCB','#FFD60A'];
function confetti(n,x,y){
  const w=fx.width=window.innerWidth, h=fx.height=window.innerHeight;
  for(let i=0;i<(n||120);i++){
    let p;
    if(x!=null){const a=rnd(0,Math.PI*2), sp=rnd(3,11); p={x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3};}
    else{const left=i%2===0; p={x:left?0:w,y:h*0.75,vx:(left?1:-1)*rnd(4,15),vy:-rnd(10,24)};}
    p.s=rnd(8,16); p.c=pick(CCOL); p.r=rnd(0,6); p.vr=rnd(-.3,.3); p.life=rnd(90,150); p.round=Math.random()<.3;
    parts.push(p);
  }
  if(!fxRaf) fxRaf=requestAnimationFrame(fxTick);
}
function fxTick(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+40);
  for(const p of parts){
    p.vy+=0.38; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.globalAlpha=Math.min(1,p.life/30); fctx.fillStyle=p.c;
    if(p.round){fctx.beginPath();fctx.arc(0,0,p.s/2,0,7);fctx.fill();} else fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    fctx.restore();
  }
  fxRaf=parts.length?requestAnimationFrame(fxTick):0;
  if(!fxRaf) fctx.clearRect(0,0,fx.width,fx.height);
}

const DOUBLE={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const CHO=[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const JUNG=[...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const JONG=['',...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
const VERT='ㅏㅐㅑㅓㅔㅕㅣ', HORI='ㅗㅛㅜㅠㅡ';
function jamoStrokes(j){
  if(JS[j]) return JS[j];
  if(DOUBLE[j]){const b=JS[DOUBLE[j]]; const half=off=>b.map(s=>s.map(([x,y])=>[x*0.52+off,y])); return half(0).concat(half(48));}
  return null;
}
const mapRect=(st,r)=>st.map(s=>s.map(([x,y])=>[r.x+x*r.w/100,r.y+y*r.h/100]));
const strokeCache={};
function strokesFor(ch){
  if(ch in strokeCache) return strokeCache[ch];
  let out=null, thick=11;
  const code=ch.charCodeAt(0);
  if(code>=0x3131&&code<=0x3163){
    const s=jamoStrokes(ch); if(s) out=mapRect(s,{x:8,y:8,w:84,h:84});
  }else if(code>=0xAC00&&code<=0xD7A3){
    const c=code-0xAC00, ci=CHO[Math.floor(c/588)], ju=JUNG[Math.floor((c%588)/28)], jo=JONG[c%28];
    const a=jamoStrokes(ci), b=jamoStrokes(ju), f=jo?jamoStrokes(jo):[];
    if(a&&b&&f){
      let ra,rb,rf;
      if(VERT.includes(ju)){
        if(!jo){ra={x:6,y:14,w:52,h:72}; rb={x:52,y:4,w:46,h:92};}
        else{ra={x:6,y:6,w:52,h:50}; rb={x:52,y:2,w:46,h:58}; rf={x:16,y:56,w:70,h:42};}
      }else if(HORI.includes(ju)){
        if(!jo){ra={x:18,y:2,w:64,h:52}; rb={x:4,y:48,w:92,h:50};}
        else{ra={x:20,y:0,w:60,h:38}; rb={x:4,y:32,w:92,h:34}; rf={x:18,y:62,w:64,h:38};}
      }
      if(ra){out=mapRect(a,ra).concat(mapRect(b,rb)); if(jo) out=out.concat(mapRect(f,rf)); thick=jo?7:8.5;}
    }
  }
  if(out) out.thick=thick;
  return (strokeCache[ch]=out);
}

function layout(){
  const r=paper.getBoundingClientRect(); if(r.width<10||r.height<10) return false;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  [gcv,dcv].forEach(c=>{c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);});
  g.setTransform(dpr,0,0,dpr,0,0); d.setTransform(dpr,0,0,dpr,0,0);
  const n=W.chars.length||1, pad=14, gap=10;
  const s=Math.max(40,Math.min(r.height-pad*2,(r.width-pad*2-gap*(n-1))/n));
  W.L={s,gap,n,dpr,w:r.width,h:r.height,ox:(r.width-(s*n+gap*(n-1)))/2,oy:(r.height-s)/2};
  return true;
}
const cellX=i=>W.L.ox+i*(W.L.s+W.L.gap);
const toPx=(ci,p)=>[cellX(ci)+p[0]/100*W.L.s, W.L.oy+p[1]/100*W.L.s];

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function tracePartial(c,pts,frac){
  let tot=0; const len=[];
  for(let i=1;i<pts.length;i++){const q=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); len.push(q); tot+=q;}
  let rem=tot*frac, tip=pts[0];
  c.beginPath(); c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const q=len[i-1];
    if(rem>=q){c.lineTo(pts[i][0],pts[i][1]); rem-=q; tip=pts[i];}
    else{const k=q?rem/q:0; tip=[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k]; c.lineTo(tip[0],tip[1]); break;}
  }
  c.stroke(); return tip;
}
function strokeLen(st){let t=0;for(let i=1;i<st.length;i++)t+=Math.hypot(st[i][0]-st[i-1][0],st[i][1]-st[i-1][1]);return t;}

function drawGuide(demo){
  const L=W.L; if(!L) return;
  g.clearRect(0,0,L.w,L.h); g.lineCap='round'; g.lineJoin='round';
  W.chars.forEach((ch,ci)=>{
    const x=cellX(ci), y=L.oy, s=L.s;
    // 공책 칸
    roundRect(g,x,y,s,s,s*0.08); g.fillStyle='#FFFDF7'; g.fill(); g.setLineDash([]); g.lineWidth=3; g.strokeStyle='#F1E4D0'; g.stroke();
    g.setLineDash([6,8]); g.lineWidth=1.5; g.strokeStyle='#F3E7D6';
    g.beginPath(); g.moveTo(x+s/2,y+8); g.lineTo(x+s/2,y+s-8); g.moveTo(x+8,y+s/2); g.lineTo(x+s-8,y+s/2); g.stroke(); g.setLineDash([]);
    const sts=strokesFor(ch);
    if(!sts){ // 획 데이터가 없는 글자: 글꼴로 점선 표시
      g.font='800 '+(s*0.78)+'px "Apple SD Gothic Neo","Noto Sans KR",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle='#F3EADF'; g.fillText(ch,x+s/2,y+s*0.53);
      g.setLineDash([8,8]); g.lineWidth=2.5; g.strokeStyle='#CDBBA6'; g.strokeText(ch,x+s/2,y+s*0.53); g.setLineDash([]);
      return;
    }
    const px=sts.map(st=>st.map(p=>toPx(ci,p)));
    // 연한 글자 몸통
    g.strokeStyle='#F0E7DA'; g.lineWidth=sts.thick/100*s;
    px.forEach(st=>tracePartial(g,st,1));
    // 시범(쓰는 순서) 색칠
    if(demo){
      g.strokeStyle='#FFC94D'; g.lineWidth=sts.thick/100*s*0.8;
      px.forEach((st,si)=>{
        if(ci<demo.ci||(ci===demo.ci&&si<demo.si)) tracePartial(g,st,1);
        else if(ci===demo.ci&&si===demo.si){
          const tip=tracePartial(g,st,demo.frac);
          g.fillStyle='#FF6B81'; g.beginPath(); g.arc(tip[0],tip[1],sts.thick/100*s*0.62,0,7); g.fill();
        }
      });
    }
    // 점선 가운데 길 + 화살표
    g.strokeStyle='#C4B19B'; g.lineWidth=Math.max(2,s*0.011); g.setLineDash([s*0.022,s*0.03]);
    px.forEach(st=>tracePartial(g,st,1)); g.setLineDash([]);
    g.fillStyle='#C4B19B';
    px.forEach(st=>{
      const a=st[st.length-2], b=st[st.length-1], ang=Math.atan2(b[1]-a[1],b[0]-a[0]), h=s*0.035;
      g.beginPath(); g.moveTo(b[0]+Math.cos(ang)*h,b[1]+Math.sin(ang)*h);
      g.lineTo(b[0]+Math.cos(ang+2.4)*h,b[1]+Math.sin(ang+2.4)*h); g.lineTo(b[0]+Math.cos(ang-2.4)*h,b[1]+Math.sin(ang-2.4)*h); g.closePath(); g.fill();
    });
    // 획순 번호
    const labels=[], R=Math.max(11,s*0.042);
    sts.forEach((st,si)=>{
      const a=st[0], b=st[1], q=Math.hypot(b[0]-a[0],b[1]-a[1])||1, ux=(b[0]-a[0])/q, uy=(b[1]-a[1])/q;
      let p=[a[0]-ux*9,a[1]-uy*9];
      let tries=0;
      while(labels.some(o=>Math.hypot(o[0]-p[0],o[1]-p[1])<9)&&tries<4){p=[p[0]-uy*9,p[1]+ux*9]; tries++;}
      p[0]=Math.max(5,Math.min(95,p[0])); p[1]=Math.max(5,Math.min(95,p[1]));
      labels.push(p);
      const c=toPx(ci,p);
      g.fillStyle='#FF8FA3'; g.beginPath(); g.arc(c[0],c[1],R,0,7); g.fill();
      g.fillStyle='#fff'; g.font='900 '+(R*1.25)+'px system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText(String(si+1),c[0],c[1]+R*0.06);
    });
  });
}

/* 쓰는 순서 시범 애니메이션 */
function stopDemo(){if(W.demo){cancelAnimationFrame(W.demo); W.demo=0;} drawGuide();}
function playDemo(){
  if(W.demo){cancelAnimationFrame(W.demo); W.demo=0;}
  const segs=[]; let total=0;
  W.chars.forEach((ch,ci)=>{const sts=strokesFor(ch); if(!sts) return; sts.forEach((st,si)=>{const dur=Math.max(260,strokeLen(st)/0.085); segs.push({ci,si,t0:total,dur}); total+=dur+280;});});
  if(!segs.length){drawGuide(); return;}
  const start=performance.now();
  const tick=now=>{
    const e=now-start;
    if(e>total+350){W.demo=0; drawGuide(); return;}
    let cur=segs[segs.length-1], frac=1;
    for(const s of segs){ if(e<s.t0+s.dur+280){cur=s; frac=Math.min(1,Math.max(0,(e-s.t0)/s.dur)); break;} }
    drawGuide({ci:cur.ci,si:cur.si,frac});
    W.demo=requestAnimationFrame(tick);
  };
  W.demo=requestAnimationFrame(tick);
}

/* 손글씨 */
function strokeStyleFor(st,i){return st.color==='rainbow'?'hsl('+((st.hue+i*5)%360)+',92%,58%)':st.color;}
function ptPx(st,i){const L=W.L,p=st.pts[i];return [L.ox+p.u*L.s, L.oy+p.v*L.s];}
function segWidth(st,i){const L=W.L,p=st.pts[i];return Math.max(st.erase?18:6, st.w*L.s*(0.55+0.9*p.p));}
function drawSeg(st,i,last){
  d.globalCompositeOperation=st.erase?'destination-out':'source-over';
  d.lineCap='round'; d.lineJoin='round'; d.strokeStyle=d.fillStyle=st.erase?'#000':strokeStyleFor(st,i);
  const lw=segWidth(st,i); d.lineWidth=lw;
  const p1=ptPx(st,i);
  if(i===0){d.beginPath(); d.arc(p1[0],p1[1],lw/2,0,7); d.fill();}
  else{
    const p0=ptPx(st,i-1), m1=[(p0[0]+p1[0])/2,(p0[1]+p1[1])/2];
    const m0=i>1?(()=>{const q=ptPx(st,i-2);return [(q[0]+p0[0])/2,(q[1]+p0[1])/2];})():p0;
    d.beginPath(); d.moveTo(m0[0],m0[1]); d.quadraticCurveTo(p0[0],p0[1],m1[0],m1[1]);
    if(last) d.lineTo(p1[0],p1[1]);
    d.stroke();
    if(!st.erase){ // 크레파스 느낌의 작은 빈 점
      d.globalCompositeOperation='destination-out';
      for(let k=0;k<2;k++){d.beginPath(); d.arc(m1[0]+rnd(-lw,lw)*0.42,m1[1]+rnd(-lw,lw)*0.42,Math.max(0.6,lw*0.06),0,7); d.fill();}
    }
  }
  d.globalCompositeOperation='source-over';
}
function replay(){
  const L=W.L; if(!L) return;
  d.clearRect(0,0,L.w,L.h);
  W.strokes.forEach(st=>{for(let i=0;i<st.pts.length;i++) drawSeg(st,i,i===st.pts.length-1);});
}
function addPoint(e){
  const L=W.L, r=dcv.getBoundingClientRect(), st=W.cur;
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const last=st.pts[st.pts.length-1];
  if(last){const lx=L.ox+last.u*L.s, ly=L.oy+last.v*L.s; if(Math.hypot(x-lx,y-ly)<1.5) return;}
  const pr=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0.5;
  st.pts.push({u:(x-L.ox)/L.s,v:(y-L.oy)/L.s,p:pr});
  drawSeg(st,st.pts.length-1,false);
}
dcv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(W.pid!==null||!W.L) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  W.pid=e.pointerId; try{dcv.setPointerCapture(e.pointerId);}catch(_){}
  W.cur={color:W.color,erase:W.erase,w:W.erase?0.13:0.05,hue:Math.floor(rnd(0,360)),pts:[]};
  W.strokes.push(W.cur); addPoint(e);
});
dcv.addEventListener('pointermove',e=>{
  if(e.pointerId!==W.pid||!W.cur) return; e.preventDefault();
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  if(evs.length) evs.forEach(addPoint); else addPoint(e);
});
function endStroke(e){
  if(e.pointerId!==W.pid) return;
  const st=W.cur; W.pid=null; W.cur=null;
  if(st&&st.pts.length>1) drawSeg(st,st.pts.length-1,true);
}
dcv.addEventListener('pointerup',endStroke);
dcv.addEventListener('pointercancel',endStroke);
dcv.addEventListener('lostpointercapture',endStroke);
['touchstart','touchmove'].forEach(t=>paper.addEventListener(t,e=>e.preventDefault(),{passive:false}));
paper.addEventListener('contextmenu',e=>e.preventDefault());

if('ResizeObserver' in window){new ResizeObserver(()=>{if(cur==='write'&&layout()){stopDemo(); replay();}}).observe(paper);}
else window.addEventListener('resize',()=>{if(cur==='write'&&layout()){stopDemo(); replay();}});

function loadItem(i){
  const n=W.list.length; W.idx=(i+n)%n;
  const it=W.list[W.idx]; W.chars=[...it.t]; W.strokes=[]; W.cur=null; W.pid=null;
  let html=it.emo?'<button class="emo" id="wEmo">'+it.emo+'</button>':'';
  html+=W.chars.map((c,k)=>'<button class="chip" data-k="'+k+'">'+c+'</button>').join('');
  setMid(html);
  $$('.chip',topMid).forEach(b=>b.onclick=()=>{const c=W.chars[+b.dataset.k]; say(JAMO_INFO[c]?JAMO_INFO[c].name:c);});
  const em=$('#wEmo'); if(em) em.onclick=()=>say(it.say);
  if(layout()){replay(); playDemo();}
  say(W.greeted?it.say:[it.say,'손가락으로 따라 써 보세요.']); W.greeted=true;
}

function checkWriting(){
  const L=W.L; if(!L) return;
  const inkPts=W.strokes.filter(s=>!s.erase).reduce((a,s)=>a+s.pts.length,0);
  if(inkPts<3){Sfx.tap(); say('글자를 따라 써 보세요.'); playDemo(); return;}
  let tot=0, hit=0, fallback=0;
  let img=null; try{img=d.getImageData(0,0,dcv.width,dcv.height).data;}catch(e){}
  const cw=dcv.width, chh=dcv.height;
  const has=(x,y)=>{x=Math.round(x*L.dpr); y=Math.round(y*L.dpr); if(x<0||y<0||x>=cw||y>=chh) return false; return img[(y*cw+x)*4+3]>40;};
  const R=L.s*0.075, offs=[[0,0]];
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2; offs.push([Math.cos(a)*R,Math.sin(a)*R],[Math.cos(a)*R/2,Math.sin(a)*R/2]);}
  if(img) W.chars.forEach((ch,ci)=>{
    const sts=strokesFor(ch); if(!sts){fallback++; return;}
    sts.forEach(st=>{
      for(let i=1;i<st.length;i++){
        const a=st[i-1], b=st[i], n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/4));
        for(let k=0;k<=n;k++){
          const p=toPx(ci,[a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
          tot++; if(offs.some(o=>has(p[0]+o[0],p[1]+o[1]))) hit++;
        }
      }
    });
  });
  const ok = tot>0 ? (hit/tot>=0.55) : (inkPts>=12*W.chars.length);
  if(!ok){Sfx.tap(); say('조금만 더 써 볼까요?'); playDemo(); return;}
  const it=W.list[W.idx]; S.done['w:'+it.t]=1; save();
  Sfx.good();
  const idx=W.idx;
  award(()=>{
    if(cur!=='write') return;
    if(idx+1<W.list.length) loadItem(idx+1); else go('pick',{kind:W.kind});
  });
}
Screens.write={
  enter(a){W.kind=a.kind; W.list=a.list; W.greeted=false; requestAnimationFrame(()=>loadItem(a.idx||0));},
  hint(){const it=W.list[W.idx]; say([it.say,'번호 순서대로 따라 써 보세요.']); playDemo();},
  leave(){if(W.demo){cancelAnimationFrame(W.demo); W.demo=0;}}
};

const G={timers:[],round:0,total:5};
function later(fn,ms){const id=setTimeout(fn,ms); G.timers.push(id); return id;}
function clearTimers(){G.timers.forEach(clearTimeout); G.timers=[];}
function dots(el,n,done){el.innerHTML=''; for(let i=0;i<n;i++){const s=document.createElement('span'); s.textContent='⭐'; if(i<done) s.className='on'; el.appendChild(s);}}
function finishGame(){Sfx.good(); award(()=>{if(cur.indexOf('game')===0) go('games');});}

};

/* ---------- 게임 A: 빈칸 채우기 ---------- */
const A={};
function nextA(){
  if(G.round>=G.total){finishGame(); return;}
  dots($('#dotsA'),G.total,G.round);
  const [word,emo]=A.deck[G.round]; A.word=word; A.wrong=0; A.lock=false;
  const chars=[...word]; A.bi=Math.floor(Math.random()*chars.length); A.ans=chars[A.bi];
  $('#aPic').textContent=emo;
  $('#aBoxes').innerHTML=chars.map((c,i)=>i===A.bi?'<div class="blank">?</div>':'<div>'+c+'</div>').join('');
  const pool=[...new Set(GAME_WORDS.map(w=>[...w[0]]).reduce((a,b)=>a.concat(b),[]))].filter(c=>!chars.includes(c));
  const opts=shuffle([A.ans].concat(shuffle(pool).slice(0,2)));
  const box=$('#aChoices'); box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o;
    b.onclick=()=>{
      if(A.lock) return;
      if(o===A.ans){
        A.lock=true; Sfx.good();
        const bl=$('#aBoxes .blank'); bl.className='fill'; bl.textContent=o;
        const r=bl.getBoundingClientRect(); confetti(40,r.left+r.width/2,r.top+r.height/2);
        say(['딩동댕!',word]); G.round++; dots($('#dotsA'),G.total,G.round);
        later(nextA,2300);
      }else{
        Sfx.bad(); A.wrong++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        say([o,'다시 골라 볼까요?']);
        if(A.wrong>=2) $$('.choice',box).forEach(x=>{if(x.textContent===A.ans) x.classList.add('glow');});
      }
    };
    box.appendChild(b);
  });
  say(G.round===0?[word,'빈칸에 들어갈 글자를 골라요.']:word);
}
$('#aPic').onclick=()=>say(A.word);
Screens.gameA={
  enter(){setMid('<span class="emo">🧩</span><span class="ttl">빈칸 채우기</span>'); G.round=0; G.total=5; A.deck=shuffle(shuffle(SEA_WORDS).slice(0,3).concat(shuffle(OTHER_WORDS).slice(0,2))); nextA();},
  hint(){say([A.word,'빈칸에 들어갈 글자를 골라요.']);},
  leave(){clearTimers();}
};

/* ---------- 게임 B: 풍선 팡팡 ---------- */
const B={};
function nextB(){
  if(G.round>=G.total){finishGame(); return;}
  dots($('#dotsB'),G.total,G.round);
  const sky=$('#sky'); sky.innerHTML='<div class="cloud" style="left:6%;bottom:4%">🐠</div><div class="cloud" style="right:8%;bottom:10%;animation-delay:-5s">🐢</div><div class="cloud" style="left:44%;bottom:1%;animation-delay:-9s">🐙</div>';
  const all=CONS.concat(VOWS);
  B.target=B.deck[G.round]; B.lock=false; B.wrong=0;
  const opts=shuffle([B.target].concat(shuffle(all.filter(j=>j.ch!==B.target.ch)).slice(0,3)));
  const cols=shuffle(BCOL);
  opts.forEach((j,i)=>{
    const w=document.createElement('div'); w.className='bwrap';
    w.style.left=((i+0.5)/opts.length*100)+'%'; w.style.top=rnd(8,26)+'%'; w.style.animationDelay=(i*0.12)+'s';
    const b=document.createElement('button'); b.className='balloon'; b.textContent=j.ch; b.style.background=cols[i%cols.length];
    b.style.animationDelay=(-rnd(0,2))+'s'; b.dataset.ch=j.ch;
    b.addEventListener('pointerdown',e=>{
      e.preventDefault(); if(B.lock) return;
      if(j.ch===B.target.ch){
        B.lock=true; Sfx.pop(); later(()=>Sfx.good(),120);
        const r=b.getBoundingClientRect(); confetti(50,r.left+r.width/2,r.top+r.height/2);
        b.classList.add('pop'); $$('.bwrap',sky).forEach(x=>{if(x!==w) x.classList.add('away');});
        say(['팡!',j.name]); G.round++; dots($('#dotsB'),G.total,G.round);
        later(nextB,1900);
      }else{
        Sfx.bad(); B.wrong++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        later(()=>b.classList.remove('shake'),450);
        say(['이건 '+j.name+'.', B.target.name+', 어디 있을까?']);
        if(B.wrong>=2) $$('.balloon',sky).forEach(x=>{if(x.dataset.ch===B.target.ch) x.classList.add('glow');});
      }
    });
    w.appendChild(b); sky.appendChild(w);
  });
  say(G.round===0?['소리를 듣고 풍선을 터뜨려요.',B.target.name]:B.target.name);
}
Screens.gameB={
  enter(){setMid('<span class="emo">🎈</span><span class="ttl">풍선 팡팡</span>'); G.round=0; G.total=6; B.deck=shuffle(CONS.concat(VOWS)).slice(0,G.total); nextB();},
  hint(){if(B.target) say(B.target.name);},
  leave(){clearTimers(); $('#sky').innerHTML='';}
};

/* ---------- 게임 C: 짝 맞추기 ---------- */
const C={};
Screens.gameC={
  enter(){
    setMid('<span class="emo">🃏</span><span class="ttl">짝 맞추기</span>');
    const six=shuffle(CONS.concat(VOWS)).slice(0,6);
    const cards=shuffle(six.concat(six).map((j,i)=>({j,col:LCOL[six.indexOf(j)%LCOL.length]})));
    C.open=[]; C.lock=false; C.left=6;
    const m=$('#mem'); m.innerHTML='';
    cards.forEach(cd=>{
      const b=document.createElement('button'); b.className='mc';
      b.innerHTML='<span class="f back">🐚</span><span class="f face" style="color:'+cd.col+'">'+cd.j.ch+'</span>';
      b.onclick=()=>{
        if(C.lock||b.classList.contains('open')||b.classList.contains('match')) return;
        Sfx.tap(); b.classList.add('open'); say(cd.j.name); C.open.push({b,cd});
        if(C.open.length<2) return;
        const [x,y]=C.open; C.open=[]; C.lock=true;
        if(x.cd.j.ch===y.cd.j.ch){
          later(()=>{
            [x,y].forEach(o=>{o.b.classList.remove('open'); o.b.classList.add('match');});
            Sfx.good(); const r=y.b.getBoundingClientRect(); confetti(36,r.left+r.width/2,r.top+r.height/2);
            C.lock=false; C.left--;
            if(C.left===0) later(finishGame,900);
          },550);
        }else{
          later(()=>{Sfx.bad(); x.b.classList.remove('open'); y.b.classList.remove('open'); C.lock=false;},1100);
        }
      };
      m.appendChild(b);
    });
    say('같은 글자 카드 두 장을 찾아요.');
  },
  hint(){say('같은 글자 카드 두 장을 찾아요.');},
  leave(){clearTimers();}
};

/* =====================================================
   스티커북
===================================================== */
Screens.book={
  enter(){
    setMid('<span class="emo">📒</span><span class="ttl">내 스티커</span>');
    const n=S.stickers.length, slots=Math.max(20,Math.ceil((n+1)/10)*10), al=$('#album'); al.innerHTML='';
    for(let i=0;i<slots;i++){
      const s=document.createElement('div');
      if(i<n){
        s.className='slot got'+(i===n-1?' new':''); s.textContent=S.stickers[i]; s.style.transform='rotate('+(((i*37)%21)-10)+'deg)';
        s.onclick=()=>{Sfx.pop(); s.classList.remove('boing','new'); void s.offsetWidth; s.classList.add('boing');};
      }else{s.className='slot'; s.textContent='★';}
      al.appendChild(s);
    }
    this.hint();
  },
  hint(){const n=S.stickers.length; say(n?'스티커를 '+n+'개 모았어요!':'글자를 쓰고 스티커를 모아 봐요.');}
};
// 부모님용 초기화: 톱니바퀴를 2초간 길게 누르기
(function(){
  const b=$('#resetBtn'); let t=0;
  const start=e=>{e.preventDefault(); t=setTimeout(()=>{
    if(window.confirm('모은 스티커와 학습 기록을 모두 지울까요?')){S={stickers:[],done:{},seen:{}}; save(); go('book');}
  },2000);};
  const stop=()=>clearTimeout(t);
  b.addEventListener('pointerdown',start); ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop));
})();

/* =====================================================
   아이패드 제스처 충돌 방지
===================================================== */
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1) e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}});
updateStar();
})();
</script>
